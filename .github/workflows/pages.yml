name: Deploy redirect

# Order 16-Sept-2026, item 6.5: the repository serves only the redirect to
# portfolio-tournament/screen.html. This workflow deploys it once per push
# (the rescore workflow that used to deploy is gone). It stops with the
# archive on or after 2026-09-23.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
