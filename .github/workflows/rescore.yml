name: Daily Rescreen

on:
  schedule:
    # Weekdays after the close (22:00 UTC ≈ 6pm ET) — settled prices for the
    # RSI / entry-level / momentum inputs. ~7 min fundamentals fetch for the
    # 535-ticker universe is well within the Actions runtime budget.
    - cron: '0 22 * * 1-5'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy

      - name: Run scoring model
        run: |
          # build_json.py calls score_universe.main() internally (writes
          # scored_universe.csv + watchlist + report) THEN emits scores.json —
          # so one call does everything. Running score_universe.py separately
          # would double the ~7-min 535-ticker fundamentals fetch for no gain.
          cd scripts
          python build_json.py

      - name: Commit results
        run: |
          git config user.name "Screener Bot"
          git config user.email "bot@screener"
          git add data/
          git diff --cached --quiet || git commit -m "📊 Rescore $(date -u +%Y-%m-%d)"
          git push

  deploy:
    needs: score
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
