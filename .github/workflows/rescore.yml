name: Daily Rescreen

on:
  schedule:
    # 23:15 UTC (#92): AFTER the tournament's 22:00 nightly builds the
    # canonical artifact this job consumes (one fetch feeds both repos).
    # Freshness/session asserts fail loudly if the canonical is stale, so a
    # tournament failure can't feed us yesterday's data silently — the
    # direct-fetch fallback then runs and says so in provenance.
    - cron: '15 23 * * 1-5'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  score:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pandas numpy pyarrow

      - name: Run scoring model
        id: score
        # [5] continue-on-error so a tripwire rejection still publishes
        # data/status.json (the staleness badge reads it) while the last good
        # board is preserved; the job is re-failed in the propagate step below.
        continue-on-error: true
        run: |
          # build_json.py calls score_universe.main() internally (writes
          # scored_universe.csv + watchlist + report) THEN emits scores.json —
          # so one call does everything. Running score_universe.py separately
          # would double the ~7-min 535-ticker fundamentals fetch for no gain.
          cd scripts
          python build_json.py

      - name: Commit results
        run: |
          git config user.name "Screener Bot"
          git config user.email "bot@screener"
          git add data/
          git diff --cached --quiet || git commit -m "📊 Rescore $(date -u +%Y-%m-%d)"
          git pull --rebase origin main || true
          git push

      - name: Propagate scoring failure
        if: steps.score.outcome == 'failure'
        run: |
          echo "scoring was rejected — last good board preserved, status.json published"
          exit 1

  deploy:
    needs: score
    # [5] deploy even when scoring was rejected: main then carries the
    # preserved board + the new status.json, which raises the badge.
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
